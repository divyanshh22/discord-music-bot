# CASE runs as a web service rather than a worker because Render's free
# plan does not offer background workers. bot.py binds $PORT so Render sees
# a healthy process; the Discord connection itself is outbound.
services:
  - type: web
    name: case-music-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: case-db
          property: connectionString

databases:
  - name: case-db
    databaseName: case
    plan: free
    ipAllowList: []
